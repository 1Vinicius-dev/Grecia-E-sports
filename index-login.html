<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Grécia E-Sports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geologica', sans-serif;
      background: #B3ADB1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 50px;
      background: #000346;
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .logo img {
      width: 200px;
      height: auto;
    }
    
    nav ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    nav a {
      color: #B3ADB1;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #AB7F32;
    }

    .login-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-box {
      background: #000346;
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 50px 40px;
      width: 100%;
      max-width: 450px;
    }

    .login-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-title h2 {
      font-size: 32px;
      font-weight: 700;
      color: #AB7F32;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .login-title p {
      font-size: 14px;
      color: #B3ADB1;
    }

    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
      color: #AB7F32;
      letter-spacing: 1px;
    }

    .form-group input {
      width: 100%;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-family: 'Geologica', sans-serif;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #AB7F32;
      background: rgba(255, 255, 255, 0.15);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #B3ADB1;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #AB7F32;
    }

    .forgot-password {
      color: #AB7F32;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .forgot-password:hover {
      opacity: 0.8;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #AB7F32 0%, #d4af37 100%);
      border: none;
      border-radius: 10px;
      color: #000346;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      font-family: 'Geologica', sans-serif;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #AB7F32;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .divider span {
      color: #AB7F32;
      font-size: 14px;
      padding: 0 15px;
    }

    .signup-link {
      text-align: center;
      font-size: 14px;
      color: #B3ADB1;
      margin-top: 20px;
    }

    .signup-link a {
      color: #AB7F32;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.3s;
      cursor: pointer;
    }

    .signup-link a:hover {
      opacity: 0.8;
    }

    footer {
      background: #000346;
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 25px;
      border-radius: 10px;
      font-weight: 600;
      z-index: 1000;
      animation: slideIn 0.3s ease;
      display: none;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .notification.success {
      background: #4CAF50;
      color: white;
    }

    .notification.error {
      background: #f44336;
      color: white;
    }

    .notification.info {
      background: #AB7F32;
      color: white;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .demo-info {
      background: rgba(171, 127, 50, 0.1);
      border: 2px solid #AB7F32;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 20px;
      color: #B3ADB1;
      font-size: 13px;
    }

    .demo-info strong {
      color: #AB7F32;
      display: block;
      margin-bottom: 8px;
    }

    .demo-credentials {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 8px;
    }

    @media (max-width: 768px) {
      header {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
      }

      nav ul {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .login-box {
        padding: 40px 25px;
      }
    }
  </style>
</head>
<body>
  <div class="notification" id="notification"></div>

  <header>
    <div class="logo">
      <img src="imagens/Logo-deitada.png" alt="Grécia E-Sports">
    </div>
    <nav>
      <ul>
        <li><a href="index1.html">INÍCIO</a></li>
        <li><a href="index1.html#loja">PRODUTOS</a></li>
        <li><a href="index2.html">TIMES</a></li>
        <li><a href="index1.html#footer">CONTATOS</a></li>
      </ul>
    </nav>
  </header>

  <div class="login-container">
    <div class="login-box">
      <div class="login-title">
        <h2 id="formTitle">BEM-VINDO</h2>
        <p id="formSubtitle">Faça login para continuar</p>
      </div>

      <!-- Informações de demonstração -->
      <div class="demo-info" id="demoInfo">
        <strong>🎮 CONTAS DE DEMONSTRAÇÃO:</strong>
        <div class="demo-credentials">
          <span>📧 admin@grecia.com | 🔑 admin123</span>
          <span>📧 joao@example.com | 🔑 123456</span>
        </div>
      </div>

      <!-- Formulário de Login -->
      <form id="loginForm">
        <div class="form-group" id="nameGroup" style="display: none;">
          <label for="name">NOME COMPLETO</label>
          <input type="text" id="name" placeholder="Seu nome completo">
        </div>

        <div class="form-group">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">SENHA</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-group" id="confirmPasswordGroup" style="display: none;">
          <label for="confirmPassword">CONFIRMAR SENHA</label>
          <input type="password" id="confirmPassword" placeholder="••••••••">
        </div>

        <div class="form-options" id="loginOptions">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Lembrar-me</span>
          </label>
          <a href="#" class="forgot-password">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="login-btn" id="submitBtn">ENTRAR</button>
      </form>

      <div class="divider">
        <span>OU</span>
      </div>

      <div class="signup-link">
        <span id="toggleText">Não tem uma conta?</span>
        <a href="#" id="toggleForm">Cadastre-se</a>
      </div>
    </div>
  </div>

  <footer>
    <p>Todos os Direitos Reservados © 2025 GRÉCIA E-SPORTS - MADE IN BRAZIL</p>
  </footer>

  <script>
    // Sistema de Autenticação
    const AuthSystem = {
        users: [
            { id: 1, name: "João Silva", email: "joao@example.com", password: "123456" },
            { id: 2, name: "Maria Santos", email: "maria@example.com", password: "senha123" },
            { id: 3, name: "Admin", email: "admin@grecia.com", password: "admin123" }
        ],

        init() {
            const saved = localStorage.getItem('greciaUsers');
            if (saved) {
                this.users = JSON.parse(saved);
            } else {
                this.saveUsers();
            }
        },

        saveUsers() {
            localStorage.setItem('greciaUsers', JSON.stringify(this.users));
        },

        register(name, email, password) {
            if (this.users.find(u => u.email === email)) {
                return { success: false, message: 'Este e-mail já está cadastrado!' };
            }

            const newUser = {
                id: this.users.length + 1,
                name: name,
                email: email,
                password: password
            };

            this.users.push(newUser);
            this.saveUsers();

            return { success: true, message: 'Cadastro realizado com sucesso!' };
        },

        login(email, password, remember = false) {
            const user = this.users.find(u => u.email === email && u.password === password);

            if (user) {
                const sessionData = {
                    id: user.id,
                    name: user.name,
                    email: user.email,
                    loginTime: new Date().toISOString()
                };

                sessionStorage.setItem('greciaUser', JSON.stringify(sessionData));

                if (remember) {
                    localStorage.setItem('greciaUserRemember', JSON.stringify(sessionData));
                }

                return { success: true, message: 'Login realizado com sucesso!', user: sessionData };
            }

            return { success: false, message: 'E-mail ou senha incorretos!' };
        },

        isLoggedIn() {
            const sessionUser = sessionStorage.getItem('greciaUser');
            const rememberUser = localStorage.getItem('greciaUserRemember');

            if (sessionUser) return JSON.parse(sessionUser);
            if (rememberUser) {
                const user = JSON.parse(rememberUser);
                sessionStorage.setItem('greciaUser', JSON.stringify(user));
                return user;
            }
            return null;
        }
    };

    // Interface
    const notification = document.getElementById('notification');
    const loginForm = document.getElementById('loginForm');
    const toggleForm = document.getElementById('toggleForm');
    const formTitle = document.getElementById('formTitle');
    const formSubtitle = document.getElementById('formSubtitle');
    const submitBtn = document.getElementById('submitBtn');
    const nameGroup = document.getElementById('nameGroup');
    const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
    const loginOptions = document.getElementById('loginOptions');
    const toggleText = document.getElementById('toggleText');
    const demoInfo = document.getElementById('demoInfo');

    let isLoginMode = true;

    function showNotification(message, type = 'info', duration = 3000) {
      notification.textContent = message;
      notification.className = `notification ${type}`;
      notification.style.display = 'block';
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, duration);
    }

    // Alternar entre login e cadastro
    toggleForm.addEventListener('click', (e) => {
      e.preventDefault();
      isLoginMode = !isLoginMode;

      if (isLoginMode) {
        formTitle.textContent = 'BEM-VINDO';
        formSubtitle.textContent = 'Faça login para continuar';
        submitBtn.textContent = 'ENTRAR';
        toggleText.textContent = 'Não tem uma conta?';
        toggleForm.textContent = 'Cadastre-se';
        nameGroup.style.display = 'none';
        confirmPasswordGroup.style.display = 'none';
        loginOptions.style.display = 'flex';
        demoInfo.style.display = 'block';
      } else {
        formTitle.textContent = 'CRIAR CONTA';
        formSubtitle.textContent = 'Cadastre-se para começar';
        submitBtn.textContent = 'CADASTRAR';
        toggleText.textContent = 'Já tem uma conta?';
        toggleForm.textContent = 'Fazer login';
        nameGroup.style.display = 'block';
        confirmPasswordGroup.style.display = 'block';
        loginOptions.style.display = 'none';
        demoInfo.style.display = 'none';
      }

      loginForm.reset();
    });

    // Processar formulário
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (isLoginMode) {
        // LOGIN
        const remember = document.getElementById('remember').checked;
        const result = AuthSystem.login(email, password, remember);

        if (result.success) {
          showNotification(result.message, 'success');
          
          setTimeout(() => {
            const redirectUrl = localStorage.getItem('greciaRedirectUrl') || 'index1.html';
            localStorage.removeItem('greciaRedirectUrl');
            window.location.href = redirectUrl;
          }, 1500);
        } else {
          showNotification(result.message, 'error');
        }
      } else {
        // CADASTRO
        const name = document.getElementById('name').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (!name) {
          showNotification('Por favor, preencha seu nome completo!', 'error');
          return;
        }

        if (password !== confirmPassword) {
          showNotification('As senhas não coincidem!', 'error');
          return;
        }

        if (password.length < 6) {
          showNotification('A senha deve ter no mínimo 6 caracteres!', 'error');
          return;
        }

        const result = AuthSystem.register(name, email, password);

        if (result.success) {
          showNotification(result.message, 'success');
          
          setTimeout(() => {
            // Auto-login após cadastro
            AuthSystem.login(email, password, false);
            window.location.href = 'index1.html';
          }, 1500);
        } else {
          showNotification(result.message, 'error');
        }
      }
    });

    // Inicializar sistema
    AuthSystem.init();

    // Verificar se já está logado
    if (AuthSystem.isLoggedIn()) {
      showNotification('Você já está logado! Redirecionando...', 'info');
      setTimeout(() => {
        window.location.href = 'index1.html';
      }, 1500);
    }
  </script>
</body>
</html>
