<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Grécia E-Sports</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@100..900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Geologica', sans-serif;
      background: #B3ADB1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: white;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 30px 50px;
      background: #000346;
      backdrop-filter: blur(10px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .logo img {
        width: 200px;
        height: auto;
    }
    nav ul {
      display: flex;
      list-style: none;
      gap: 30px;
    }

    nav a {
      color: #B3ADB1;
      text-decoration: none;
      font-weight: 500;
      font-size: 14px;
      letter-spacing: 1px;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #AB7F32;
    }

    /* Container Principal */
    .login-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .login-box {
      background: #000346;
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 50px 40px;
      width: 100%;
      max-width: 450px;
    }

    .login-title {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-title h2 {
      font-size: 32px;
      font-weight: 700;
      color: #AB7F32;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    .login-title p {
      font-size: 14px;
      color: #B3ADB1;
    }

    /* Formulário */
    .form-group {
      margin-bottom: 25px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
      color: #AB7F32;
      letter-spacing: 1px;
    }

    .form-group input {
      width: 100%;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #AB7F32;
      font-size: 16px;
      font-family: 'Geologica', sans-serif;
      transition: all 0.3s;
    }

    .form-group input:focus {
      outline: none;
      border-color: #AB7F32;
      background: rgba(255, 255, 255, 0.15);
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      font-size: 13px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      color: #B3ADB1;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #AB7F32;
    }

    .forgot-password {
      color: #AB7F32;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .forgot-password:hover {
      opacity: 0.8;
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #AB7F32 0%, #AB7F32 100%);
      border: none;
      border-radius: 10px;
      color: #000346;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
      font-family: 'Geologica', sans-serif;
        
    }

    .enter{
        text-decoration: none;
        color: #000346;
    }

    .login-btn:hover {
      transform: translateY(-2px);
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      position: relative;
    }

    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #AB7F32;
    }

    .divider::before {
      left: 0;
    }

    .divider::after {
      right: 0;
    }

    .divider span {
      color: #AB7F32;
      font-size: 14px;
      padding: 0 15px;

    }

    .social-login {
      display: flex;
      gap: 15px;
      margin-bottom: 25px;
    }

    .social-btn {
      flex: 1;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: #B3ADB1;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .google-icon{
        width: 20px;
    }

    .discord-icon{
        width: 20px;
    }

    .social-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: #AB7F32;
    }

    .signup-link {
      text-align: center;
      font-size: 14px;
      color: #B3ADB1;
    }

    .signup-link a {
      color: #AB7F32;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.3s;
    }

    .signup-link a:hover {
      opacity: 0.8;
    }

    /* Footer */
    footer {
      background: #000346;
      padding: 20px;
      text-align: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }

    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      background: linear-gradient(135deg, #AB7F32 0%, #AB7F32 100%);
      color: white;
      padding: 15px 25px;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
      font-weight: 600;
      z-index: 1000;
      animation: slideIn 0.3s ease;
      display: none;
    }

    @keyframes slideIn {
      from {
        transform: translateX(400px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
       body {
        background: url(imagens/telalogin.png) no-repeat center bottom;
        background-size: cover;
        background-attachment: fixed;
       }
      
        header {
        padding: 20px;
        flex-direction: column;
        gap: 20px;
      }

      nav ul {
        gap: 15px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .login-box {
        padding: 40px 25px;
      }

      .social-login {
        flex-direction: column;
      }
      
    }
  </style>
</head>
<body>
  <div class="notification" id="notification"></div>

  <header>
    <div class="logo">
     <img src="imagens/Logo-deitada.png" alt="">
    </div>
    <nav>
      <ul>
        <li><a href="index1.html">INÍCIO</a></li>
        <li><a href="#">PRODUTOS</a></li>
        <li><a href="#">TIMES</a></li>
        <li><a href="#">CONTATOS</a></li>
      </ul>
    </nav>
  </header>

  <div class="login-container">
    <div class="login-box">
      <div class="login-title">
        <h2>BEM-VINDO</h2>
        <p>Faça login para continuar</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">E-MAIL</label>
          <input type="email" id="email" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label for="password">SENHA</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="remember">
            <span>Lembrar-me</span>
          </label>
          <a href="#" class="forgot-password">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="login-btn"><a href="index1.html" class="enter">ENTRAR</a></button>
      </form>

      <div class="divider">
        <span>OU</span>
      </div>

      <div class="social-login">
        <button class="social-btn" onclick="loginSocial('Google')">
           <img src="imagens/Google.png" class="google-icon" alt=""><span>Google</span>
        </button>
        <button class="social-btn" onclick="loginSocial('Discord')">
           <img src="imagens/Discord.png" class="discord-icon" alt=""><span>Discord</span>
        </button>
      </div>

      <div class="signup-link">
        Não tem uma conta? <a href="#">Cadastre-se</a>
      </div>
    </div>
  </div>

  <footer>
    <p>Todos os Direitos Reservados © 2025 GRÉCIA E-SPORTS - MADE IN BRAZIL</p>
  </footer>

  <script>
    const loginForm = document.getElementById('loginForm');
    const notification = document.getElementById('notification');

    function showNotification(message, duration = 3000) {
      notification.textContent = message;
      notification.style.display = 'block';
      
      setTimeout(() => {
        notification.style.display = 'none';
      }, duration);
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      // Simulação de login
      showNotification('✓ Login realizado com sucesso!');
      
      // Aqui você adicionaria a lógica real de autenticação
      setTimeout(() => {
        // window.location.href = 'index1.html';
      }, 1500);
    });

    function loginSocial(platform) {
      showNotification(`Login com ${platform} em desenvolvimento...`);
    }

    // Animação de entrada suave
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelector('.login-box').style.animation = 'slideIn 0.5s ease';
    });
  </script>
</body>
</html>
